<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calorie Counter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Log what you eat, track the daily total against a target, and sync it across every device.">
<meta name="theme-color" content="#b06a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calorie Counter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f2efe8;
    --surface: #ffffff;
    --surface-2: #e8e3d7;
    --border: #ddd6c6;
    --border-strong: #c8c0ab;
    --text: #221f18;
    --text-muted: #6d685a;
    --text-faint: #948d79;
    --accent: #b06a1e;
    --accent-soft: #f3e7d6;
    --accent-contrast: #ffffff;
    --good: #4f7d4a;
    --good-soft: #e5efe0;
    --danger: #ab4a3a;
    --danger-soft: #f5e5e1;
    --focus-ring: #b06a1e;

    --meal-breakfast: #b8862c;
    --meal-lunch: #4f7d4a;
    --meal-dinner: #4f6f89;
    --meal-snack: #8a5a86;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1815;
      --surface: #24221e;
      --surface-2: #2d2a24;
      --border: #3a362d;
      --border-strong: #4c4739;
      --text: #ece7db;
      --text-muted: #a39d8a;
      --text-faint: #7d7663;
      --accent: #dda86a;
      --accent-soft: #362a1c;
      --accent-contrast: #1c1508;
      --good: #8cbf82;
      --good-soft: #1f2c1c;
      --danger: #dd8c7a;
      --danger-soft: #38241f;
      --focus-ring: #dda86a;

      --meal-breakfast: #d6a94f;
      --meal-lunch: #8cbf82;
      --meal-dinner: #8fb0c9;
      --meal-snack: #c49bbf;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a1815;
    --surface: #24221e;
    --surface-2: #2d2a24;
    --border: #3a362d;
    --border-strong: #4c4739;
    --text: #ece7db;
    --text-muted: #a39d8a;
    --text-faint: #7d7663;
    --accent: #dda86a;
    --accent-soft: #362a1c;
    --accent-contrast: #1c1508;
    --good: #8cbf82;
    --good-soft: #1f2c1c;
    --danger: #dd8c7a;
    --danger-soft: #38241f;
    --focus-ring: #dda86a;

    --meal-breakfast: #d6a94f;
    --meal-lunch: #8cbf82;
    --meal-dinner: #8fb0c9;
    --meal-snack: #c49bbf;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 22px 96px;
  }

  header.masthead { margin-bottom: 28px; }

  .masthead-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .lang-toggle button {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--surface);
    border: none;
    border-left: 1px solid var(--border-strong);
    padding: 5px 9px;
    cursor: pointer;
  }

  .lang-toggle button:first-child { border-left: none; }
  .lang-toggle button[data-active="true"] { background: var(--accent); color: var(--accent-contrast); }

  h1 {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 33px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 14.5px;
    max-width: 54ch;
  }

  /* --- date bar --- */

  .datebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-strong);
  }

  .date-nav {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    display: grid;
    place-content: center;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }

  .date-nav:hover { border-color: var(--accent); color: var(--accent); }

  .date-center { text-align: center; flex: 1; min-width: 0; }

  .date-label {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }

  .today-btn {
    display: block;
    margin: 2px auto 0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
  }

  .today-btn[hidden] { display: none; }

  /* --- view toggle --- */

  .view-toggle {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }

  .view-toggle .segmented button { padding: 6px 15px; }

  /* --- week overview --- */

  .week { margin-top: 18px; }

  .week-row {
    display: grid;
    grid-template-columns: 62px 1fr 58px;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 12px 2px;
    cursor: pointer;
    text-align: left;
    font: inherit;
  }

  .week-row:hover .wr-day { color: var(--accent); }
  .week-row.today .wr-day { color: var(--accent); font-weight: 700; }
  .week-row:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .wr-day {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .wr-track {
    display: block;
    height: 8px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }

  .wr-fill {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease, background 0.2s ease;
  }

  .wr-fill.under { background: var(--good); }
  .wr-fill.over { background: var(--danger); }

  .wr-kcal {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .wr-kcal.none { color: var(--text-faint); font-weight: 400; }
  .wr-kcal.over { color: var(--danger); }
  .wr-kcal.under { color: var(--good); }

  .week-summary {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* --- calendar --- */

  .cal { margin-top: 18px; }

  .cal-weekdays,
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .cal-weekday {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding-bottom: 4px;
  }

  .cal-grid { margin-top: 2px; }

  .cal-cell {
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 6px;
    background: var(--surface);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.12s ease;
  }

  .cal-cell:hover { border-color: var(--accent); }
  .cal-cell.blank { border: none; background: none; cursor: default; }
  .cal-cell.future { opacity: 0.5; }

  .cal-cell .cd {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .cal-cell .ck {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    align-self: flex-end;
  }

  .cal-cell .ck.none { color: var(--text-faint); font-weight: 400; }

  .cal-cell.under { background: var(--good-soft); border-color: var(--good-soft); }
  .cal-cell.under .ck { color: var(--good); }
  .cal-cell.over { background: var(--danger-soft); border-color: var(--danger-soft); }
  .cal-cell.over .ck { color: var(--danger); }
  .cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  .cal-cell:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .month-summary {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .cal-legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
  }

  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }

  .cal-legend i {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    display: inline-block;
  }

  .cal-legend i.l-under { background: var(--good); }
  .cal-legend i.l-over { background: var(--danger); }
  .cal-legend i.l-none { background: var(--border-strong); }

  /* --- summary / progress --- */

  .summary { margin-top: 18px; }

  .summary-figures {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .total-kcal {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 24px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .total-kcal .unit { font-size: 14px; color: var(--text-faint); font-weight: 500; }

  .goal-wrap {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .goal-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 2px 7px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  .goal-btn:hover { border-color: var(--accent); }

  .goal-input {
    font-family: var(--font-mono);
    font-size: 12.5px;
    width: 74px;
    padding: 2px 6px;
    border: 1px solid var(--focus-ring);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  .progress {
    margin-top: 12px;
    height: 10px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease, background 0.2s ease;
  }

  .progress-fill.over { background: var(--danger); }

  .remaining {
    margin-top: 7px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .remaining.over { color: var(--danger); font-weight: 600; }

  /* --- add form --- */

  form.add-form { margin: 24px 0 4px; }

  .add-row { display: flex; gap: 8px; }

  .add-row input[type="text"].food {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 11px 13px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .add-row input.kcal {
    width: 84px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 14px;
    text-align: right;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 11px 10px;
    outline: none;
  }

  .add-row input::placeholder { color: var(--text-faint); }

  .add-row input:focus-visible {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .add-row button.primary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--accent-contrast);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }

  .add-row button.primary:hover { opacity: 0.88; }

  .add-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-right: 2px;
  }

  .segmented {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    overflow: hidden;
  }

  .segmented button {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: none;
    border-left: 1px solid var(--border-strong);
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
  }

  .segmented button:first-child { border-left: none; }
  .segmented button[data-active="true"] { background: var(--accent-soft); color: var(--accent); }

  /* --- list --- */

  ul.list {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
  }

  .meal-group + .meal-group { margin-top: 6px; }

  .meal-head {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 2px 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .meal-head .m-breakfast { color: var(--meal-breakfast); }
  .meal-head .m-lunch { color: var(--meal-lunch); }
  .meal-head .m-dinner { color: var(--meal-dinner); }
  .meal-head .m-snack { color: var(--meal-snack); }

  .meal-head .subtotal { color: var(--text-faint); font-weight: 500; }

  li.entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--border);
  }

  .entry-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    color: var(--text);
    word-wrap: break-word;
    cursor: text;
    outline: none;
    border-radius: 3px;
  }

  .entry-name:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }

  .entry-kcal {
    width: 74px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 13.5px;
    text-align: right;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 3px 6px;
    outline: none;
    font-variant-numeric: tabular-nums;
  }

  .entry-kcal:hover { border-color: var(--border-strong); }
  .entry-kcal:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft); color: var(--text); }

  .del-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: grid;
    place-content: center;
    background: transparent;
    border: none;
    border-radius: 5px;
    color: var(--text-faint);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease;
  }

  li.entry:hover .del-btn,
  li.entry:focus-within .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--danger); background: var(--danger-soft); }

  .del-btn:focus-visible,
  .segmented button:focus-visible,
  .lang-toggle button:focus-visible,
  .date-nav:focus-visible,
  .today-btn:focus-visible,
  .goal-btn:focus-visible,
  .icon-action:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .empty-state {
    padding: 44px 4px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .empty-state .glyph {
    font-size: 26px;
    margin-bottom: 8px;
    display: block;
    opacity: 0.5;
  }

  /* --- footer --- */

  footer.status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding-top: 10px;
    border-top: 1px solid var(--border-strong);
  }

  .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .count strong { color: var(--text); font-weight: 600; }

  .icon-action {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    text-decoration: underline;
    text-decoration-color: var(--border-strong);
    text-underline-offset: 3px;
  }

  .icon-action:hover { color: var(--accent); text-decoration-color: var(--accent); }

  details.transfer {
    margin-top: 22px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  details.transfer summary {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    cursor: pointer;
    list-style: none;
  }

  details.transfer summary::-webkit-details-marker { display: none; }
  details.transfer summary::before { content: "+ "; }
  details.transfer[open] summary::before { content: "\2212 "; }

  .transfer-body { margin-top: 12px; }
  .transfer-body p { margin: 0 0 8px; font-size: 12.5px; color: var(--text-muted); }

  textarea.io {
    width: 100%;
    min-height: 90px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 10px;
    outline: none;
    resize: vertical;
  }

  textarea.io:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft); }

  .transfer-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .btn-sm {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;

  function decide(value) {

  function shiftDate(str, delta) {
    var p = str.split("-");

    d.setDate(d.getDate() + delta);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function shiftMonth(ym, delta) {
    var p = ym.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  }
  function weekStartOf(str) {
    var p = str.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() - d.getDay());   // back to Sunday
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

        entries: Array.isArray(p.entries) ? p.entries : [],

  }

  function normalizeEntries(list) {

    if (mode === "week") {
      var wEnd = shiftDate(weekStart, 6);
      var wp0 = weekStart.split("-"), wp1 = wEnd.split("-");
      var wd0 = new Date(Number(wp0[0]), Number(wp0[1]) - 1, Number(wp0[2]));
      var wd1 = new Date(Number(wp1[0]), Number(wp1[1]) - 1, Number(wp1[2]));
      try {
        var opt = { month: "short", day: "numeric" };
        dateLabelEl.textContent = wd0.toLocaleDateString(T("locale"), opt) + " – " +
          wd1.toLocaleDateString(T("locale"), opt);
      } catch (e) { dateLabelEl.textContent = weekStart + " – " + wEnd; }
      todayBtn.hidden = (weekStart === weekStartOf(todayStr()));
      todayBtn.textContent = T("thisWeek");
      renderWeek();
      return;
    }

    todayBtn.textContent = T("today");

    // date bar
    var p = selectedDate.split("-");
    var dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    try {
      dateLabelEl.textContent = dObj.toLocaleDateString(T("locale"), { weekday: "long", month: "long", day: "numeric" });
    } catch (e) {
      dateLabelEl.textContent = selectedDate;
    }
    todayBtn.hidden = (selectedDate === todayStr());

    var day = dayEntries();
    var total = day.reduce(function (s, it) { return s + it.kcal; }, 0);

    totalNumEl.textContent = nf(total);
    goalBtn.textContent = nf(goal);

    var pct = goal > 0 ? (total / goal) * 100 : 0;
    progressFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    var over = total > goal;
    progressFill.classList.toggle("over", over);
    var diff = Math.abs(goal - total);
    remainingEl.textContent = over ? fmt(T("over"), { n: nf(diff) }) : fmt(T("left"), { n: nf(diff) });
    remainingEl.classList.toggle("over", over);

    // list grouped by meal
    listEl.innerHTML = "";
    if (day.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty-state";
      var g = document.createElement("span");
      g.className = "glyph"; g.textContent = "🍽";
      empty.appendChild(g);
      empty.appendChild(document.createTextNode(T("emptyDay")));
      listEl.appendChild(empty);
    } else {
      MEALS.forEach(function (meal) {
        var group = day.filter(function (it) { return it.meal === meal; })
          .sort(function (a, b) { return a.createdAt - b.createdAt; });
        if (group.length === 0) return;
        var sub = group.reduce(function (s, it) { return s + it.kcal; }, 0);

        var wrap = document.createElement("li");
        wrap.className = "meal-group";

        var head = document.createElement("div");
        head.className = "meal-head";
        var mname = document.createElement("span");
        mname.className = "m-" + meal;
        mname.textContent = T(meal);
        var msub = document.createElement("span");
        msub.className = "subtotal";
        msub.textContent = nf(sub) + " kcal";
        head.appendChild(mname);
        head.appendChild(msub);
        wrap.appendChild(head);

        var inner = document.createElement("ul");
        inner.style.listStyle = "none";
        inner.style.margin = "0";
        inner.style.padding = "0";

        group.forEach(function (item) {
          var li = document.createElement("li");
          li.className = "entry";

          var name = document.createElement("span");
          name.className = "entry-name";
          name.textContent = item.name;
          name.contentEditable = "true";
          name.spellcheck = false;
          name.setAttribute("role", "textbox");
          name.setAttribute("aria-label", T("nameAria"));
          name.addEventListener("blur", function () {
            var val = name.textContent.replace(/\s+/g, " ").trim();
            if (val === "" && !item.kcal) {
              entries = entries.filter(function (it) { return it !== item; });
              save(); render(); return;
            }
            item.name = val.slice(0, 80);
            name.textContent = item.name;
            save();
          });
          name.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); name.blur(); }
          });

          var kc = document.createElement("input");
          kc.type = "text";
          kc.inputMode = "numeric";
          kc.className = "entry-kcal";
          kc.setAttribute("aria-label", T("kcalAria"));
          bindKcal(kc, item);

          var del = document.createElement("button");
          del.type = "button";
          del.className = "del-btn";
          del.setAttribute("aria-label", T("del"));
          del.textContent = "✕";
          del.addEventListener("click", function () {
            entries = entries.filter(function (it) { return it !== item; });
            save(); render();
          });

          li.appendChild(name);
          li.appendChild(kc);
          li.appendChild(del);
          inner.appendChild(li);
        });

        wrap.appendChild(inner);
        listEl.appendChild(wrap);
      });
    }

    countEl.innerHTML = day.length === 0 ? "" :
      fmt(T(day.length === 1 ? "countOne" : "count"),
        { n: "<strong>" + day.length + "</strong>", kcal: nf(total) });

    // food name suggestions (recent distinct names)
    var names = [];
    var seen = {};
    entries.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (it) {
      var n = it.name.trim();
      if (n && !seen[n.toLowerCase()]) { seen[n.toLowerCase()] = true; names.push(n); }
    });
    foodListEl.innerHTML = "";
    names.slice(0, 40).forEach(function (n) {
      var o = document.createElement("option");
      o.value = n;
      foodListEl.appendChild(o);
    });
  }

  /* --- calendar --- */
  function compactKcal(n) {
    if (n >= 1000) {
      var s = (n / 1000).toFixed(1).replace(/\.0$/, "");
      return s + "k";
    }
    return String(n);
  }

  /* --- week overview --- */
  function renderWeek() {
    var todayS = todayStr();
    weekRowsEl.innerHTML = "";
    var weekTotal = 0, loggedDays = 0, onTarget = 0;

    for (var i = 0; i < 7; i++) {
      var ds = shiftDate(weekStart, i);
      var total = dayTotal(ds);
      var p = ds.split("-");
      var dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));

      var row = document.createElement("button");
      row.type = "button";
      row.className = "week-row" + (ds === todayS ? " today" : "");

      var dayLbl = document.createElement("span");
      dayLbl.className = "wr-day";
      try {
        dayLbl.textContent = dObj.toLocaleDateString(T("locale"), { weekday: "short" }) + " " + Number(p[2]);
      } catch (e) { dayLbl.textContent = ds.slice(5); }

      var track = document.createElement("span");
      track.className = "wr-track";
      var fill = document.createElement("span");
      fill.className = "wr-fill";
      var pct = goal > 0 ? (total / goal) * 100 : 0;
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";

      var kc = document.createElement("span");
      kc.className = "wr-kcal";

      if (total > 0) {
        weekTotal += total;
        loggedDays++;
        if (total <= goal) { fill.classList.add("under"); kc.classList.add("under"); onTarget++; }
        else { fill.classList.add("over"); kc.classList.add("over"); }
        kc.textContent = nf(total);
      } else {
        kc.classList.add("none");
        kc.textContent = "–";
      }

      track.appendChild(fill);
      row.appendChild(dayLbl);
      row.appendChild(track);
      row.appendChild(kc);
      row.setAttribute("aria-label", ds + (total > 0 ? " · " + nf(total) + " kcal" : ""));

      (function (date) {
        row.addEventListener("click", function () {
          selectedDate = date;
          setViewToggle("day");
          render();
        });
      })(ds);

      weekRowsEl.appendChild(row);
    }

    weekSummaryEl.textContent = loggedDays === 0
      ? T("weekSummaryEmpty")
      : fmt(T("weekSummary"), {
          total: nf(weekTotal),
          avg: nf(Math.round(weekTotal / loggedDays)),
          ontarget: onTarget
        });
  }

  function renderCalendar() {
    var mp = calMonth.split("-");
    var year = Number(mp[0]);
    var month0 = Number(mp[1]) - 1;
    var first = new Date(year, month0, 1);
    var startDow = first.getDay();               // 0 = Sunday
    var daysInMonth = new Date(year, month0 + 1, 0).getDate();
    var todayS = todayStr();

    // weekday headers (locale, Sunday-first)
    calWeekdaysEl.innerHTML = "";
    for (var w = 0; w < 7; w++) {
      var wd = document.createElement("div");
      wd.className = "cal-weekday";
      var ref = new Date(2023, 0, 1 + w); // Jan 1 2023 = Sunday
      try { wd.textContent = ref.toLocaleDateString(T("locale"), { weekday: "short" }); }
      catch (e) { wd.textContent = ["S", "M", "T", "W", "T", "F", "S"][w]; }
      calWeekdaysEl.appendChild(wd);
    }

    calGridEl.innerHTML = "";
    for (var b = 0; b < startDow; b++) {
      var pad = document.createElement("div");
      pad.className = "cal-cell blank";
      calGridEl.appendChild(pad);
    }

    var loggedDays = 0, sumLogged = 0, onTarget = 0;

    for (var d = 1; d <= daysInMonth; d++) {
      var ds = year + "-" + pad2(month0 + 1) + "-" + pad2(d);
      var total = dayTotal(ds);
      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cal-cell";
      if (total > 0) {
        loggedDays++;
        sumLogged += total;
        if (total <= goal) { cell.classList.add("under"); onTarget++; }
        else { cell.classList.add("over"); }
      }
      if (ds === todayS) cell.classList.add("today");
      if (ds > todayS) cell.classList.add("future");

      var cd = document.createElement("span");
      cd.className = "cd";
      cd.textContent = d;
      var ck = document.createElement("span");
      ck.className = "ck" + (total > 0 ? "" : " none");
      ck.textContent = total > 0 ? compactKcal(total) : "–";
      cell.appendChild(cd);
      cell.appendChild(ck);

      cell.setAttribute("aria-label", ds + (total > 0 ? " · " + nf(total) + " kcal" : ""));
      (function (date) {
        cell.addEventListener("click", function () {
          selectedDate = date;
          setViewToggle("day");
          render();
        });
      })(ds);

      calGridEl.appendChild(cell);
    }

    if (loggedDays === 0) {
      monthSummaryEl.textContent = T("monthSummaryEmpty");
    } else {
      monthSummaryEl.textContent = fmt(T(loggedDays === 1 ? "monthSummaryOne" : "monthSummary"), {
        logged: loggedDays,
        avg: nf(Math.round(sumLogged / loggedDays)),
        ontarget: onTarget
      });
    }

    calLegendEl.innerHTML =
      '<span><i class="l-under"></i>' + T("legUnder") + "</span>" +
      '<span><i class="l-over"></i>' + T("legOver") + "</span>" +
      '<span><i class="l-none"></i>' + T("legNone") + "</span>";
  }

  /* --- add --- */
  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = foodEl.value.replace(/\s+/g, " ").trim();
    var kcal = Math.max(0, Math.min(99999, Math.round(Number(String(kcalEl.value).replace(/[^0-9]/g, "")) || 0)));
    if (!name && !kcal) return;

    // reuse last kcal for a known food when kcal left blank
    if (!kcal && name) {
      var prev = entries.slice().sort(function (a, b) { return b.createdAt - a.createdAt; })
        .filter(function (it) { return it.name.toLowerCase() === name.toLowerCase() && it.kcal; })[0];
      if (prev) kcal = prev.kcal;
    }

    entries.push({
      id: makeId(),
      name: name || T(pendingMeal),
      kcal: kcal,
      meal: pendingMeal,
      date: selectedDate,
      createdAt: Date.now()
    });
    save();
    foodEl.value = "";
    kcalEl.value = "";
    foodEl.focus();
    render();
  });

  /* --- copy / share --- */
  function buildShareText() {
    var day = dayEntries();
    var p = selectedDate.split("-");
    var dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var dateStr;
    try { dateStr = dObj.toLocaleDateString(T("locale"), { weekday: "long", year: "numeric", month: "long", day: "numeric" }); }
    catch (e) { dateStr = selectedDate; }

    var lines = ["🔥 " + dateStr, ""];
    var total = 0;
    MEALS.forEach(function (meal) {
      var group = day.filter(function (it) { return it.meal === meal; })
        .sort(function (a, b) { return a.createdAt - b.createdAt; });
      if (group.length === 0) return;
      lines.push("[" + T(meal) + "]");
      group.forEach(function (it) {
        total += it.kcal;
        lines.push("  " + it.name + " — " + nf(it.kcal) + " kcal");
      });
    });
    lines.push("");
    lines.push(fmt(T("shareTotal"), { kcal: nf(total), goal: nf(goal) }));
    return lines.join("\n").trim();
  }
  copyBtn.addEventListener("click", function () { copyText(buildShareText(), T("copyOk")); });

  /* --- backup / transfer --- */
  exportBtn.addEventListener("click", function () {
    ioBox.value = JSON.stringify({ entries: entries, goal: goal }, null, 2);
    ioBox.focus(); ioBox.select();
    toast(T("fillOk"));
  });

  importBtn.addEventListener("click", function () {
    var raw = ioBox.value.trim();
    if (!raw) { toast(T("importEmpty")); return; }
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { toast(T("importBad")); return; }
    var incoming = Array.isArray(parsed) ? { entries: parsed, goal: goal } : parsed;
    if (!incoming || !Array.isArray(incoming.entries)) { toast(T("importBad")); return; }
    if ((entries.length || goal !== DEFAULT_GOAL) && !importArmed) {
      importArmed = true;
      importBtn.textContent = T("importArm");
      clearTimeout(importArmTimer);
      importArmTimer = setTimeout(function () { importArmed = false; importBtn.textContent = T("importBtn"); }, 4000);
      return;
    }
    clearTimeout(importArmTimer);
    importArmed = false;
    importBtn.textContent = T("importBtn");
    entries = normalizeEntries(incoming.entries);
    if (typeof incoming.goal === "number" && incoming.goal > 0) goal = Math.min(99999, Math.round(incoming.goal));
    save();
    render();
    toast(fmt(T("importDone"), { n: entries.length }));
  });

  /* --- live sync (Firebase; optional) --- */
  function schedulePush() {
    if (!syncApi) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 600);
  }
  function pushRemote() {
    if (!syncApi) return;
    var rev = makeId();
    myRev = rev;
    var attempt = syncApi.push({ entries: entries, goal: goal, rev: rev, updatedAt: Date.now() });
    if (attempt && typeof attempt.catch === "function") {
      attempt.catch(function () { clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 4000); });
    }
  }
  function mergeById(remoteList, localList) {
    var seen = {}, out = [];
    remoteList.forEach(function (it) { if (it && it.id) { seen[it.id] = true; out.push(it); } });
    localList.forEach(function (it) { if (it && it.id && !seen[it.id]) out.push(it); });
    return out;
  }
  function adoptRemote(d) {
    entries = normalizeEntries(d.entries);
    if (typeof d.goal === "number" && d.goal > 0) goal = Math.min(99999, Math.round(d.goal));
    saveLocal();
    render();
  }
  function onRemote(d) {
    var goLive = function () { if (!syncActive) { syncActive = true; applyLang(); } };

    if (d === null || d === undefined || typeof d !== "object") {
      reconciled = true; goLive();
      if (entries.length || goal !== DEFAULT_GOAL) pushRemote();
      return;
    }
    var remoteEntries = Array.isArray(d.entries) ? d.entries : [];

    if (d.rev && d.rev === myRev) { reconciled = true; goLive(); return; }

    if (!reconciled) {
      reconciled = true;
      if (entries.length && remoteEntries.length) {
        entries = normalizeEntries(mergeById(normalizeEntries(remoteEntries), entries));
        if (typeof d.goal === "number" && d.goal > 0) goal = Math.min(99999, Math.round(d.goal));
        saveLocal(); render(); pushRemote();
      } else if (remoteEntries.length) {
        adoptRemote(d);
      } else if (entries.length || goal !== DEFAULT_GOAL) {
        pushRemote();
      } else if (typeof d.goal === "number" && d.goal > 0) {
        adoptRemote(d);
      }
      goLive();
      return;
    }

    adoptRemote(d);
    goLive();
  }
  function setupSync(api) {
    syncApi = api;
    api.ready.then(function (ok) {
      if (!ok) { syncApi = null; return; }
      api.subscribe(onRemote);
    }).catch(function () { syncApi = null; });
  }
  function whenSyncDecided(cb) {
    if (window.CC_SYNC_DECIDED) { cb(window.CC_SYNC || null); return; }
    var done = false;
    var fire = function () { if (done) return; done = true; cb(window.CC_SYNC || null); };
    window.addEventListener("cc-sync-decided", fire, { once: true });
    setTimeout(fire, 12000);
  }

  /* --- service worker --- */
  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        var ping = function () {
          if (reg.waiting) reg.waiting.postMessage("skip-waiting");
        };
        ping();
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (nw) nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage("skip-waiting");
          });
        });
        reg.update();
        setInterval(function () { reg.update(); }, 60 * 60 * 1000);
      }).catch(function () {});
    });
  }

  /* --- language --- */
  function setText(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }

  function applyLang() {
    document.documentElement.lang = T("htmlLang");
    document.title = T("title");
    setText("eyebrow", T(syncActive ? "eyebrowSync" : "eyebrow"));
    setText("app-title", T("title"));
    setText("subtitle", T(syncActive ? "subtitleSync" : "subtitle"));
    var vb = viewToggleEl.querySelectorAll("button");
    if (vb[0]) vb[0].textContent = T("viewDay");
    if (vb[1]) vb[1].textContent = T("viewWeek");
    if (vb[2]) vb[2].textContent = T("viewMonth");
    viewToggleEl.setAttribute("aria-label", T("viewWeek"));
    setText("goal-label", T("goalLabel"));
    goalBtn.setAttribute("aria-label", T("editGoal"));
    foodEl.placeholder = T("foodPlaceholder");
    foodEl.setAttribute("aria-label", T("nameAria"));
    kcalEl.placeholder = T("kcalPlaceholder");
    kcalEl.setAttribute("aria-label", T("kcalAria"));
    setText("add-btn", T("add"));
    setText("meal-label", T("mealLabel"));

    var mb = mealPickerEl.querySelectorAll("button");
    MEALS.forEach(function (m, i) { if (mb[i]) mb[i].textContent = T(m); });
    mealPickerEl.setAttribute("aria-label", T("mealLabel"));

    setText("copy-btn", T("copy"));
    setText("transfer-summary", T("transferSummary"));
    setText("transfer-desc", T("transferDesc"));
    setText("export-btn", T("fill"));
    importBtn.textContent = importArmed ? T("importArm") : T("importBtn");
    ioBox.setAttribute("aria-label", T("ioLabel"));

    langToggleEl.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("data-active", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    langToggleEl.setAttribute("aria-label", T("langGroup"));

    render();
  }

  langToggleEl.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    lang = b.getAttribute("data-lang") === "ko" ? "ko" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
    applyLang();
  });

  /* --- init --- */
  registerServiceWorker();
  setMealPicker(pendingMeal);
  setViewToggle("day");
  applyLang();
  whenSyncDecided(function (api) { if (api) setupSync(api); });
})();
</script>

</body>
</html>
